    if(rSimple()) x.title = data.title;
    else { Object.assign(x, data); if(r.convert){ x.kind='rotina'; x.createdAt=today(); } }
  } else S.routines.push({id:uid(), kind:'rotina', createdAt:today(), ...data});
  persist(); $('#routineDlg').close(); render();
}

/* ============ diálogo de dados ============ */
function openData(){
  wipeArmed = false;
  const conta = cloudOn
    ? `<section class="setsec"><h3>Conta</h3>
        <p class="hint">Conectado como <b>${esc(cemail || 'sua conta')}</b>.<br>Sincronização: <b id="syncMsg">${esc(syncText())}</b></p>
        <div class="dlg-foot"><button class="btn" data-act="sync-now">Sincronizar agora</button><button class="btn" data-act="logout">Sair</button></div>
        <details class="adv"><summary>Trocar senha</summary><div class="pwform">
          <label class="field"><span>Senha atual</span><input id="pwOld" type="password" autocomplete="current-password"></label>
          <label class="field"><span>Nova senha (mínimo de 8 caracteres)</span><input id="pwNew" type="password" autocomplete="new-password"></label>
          <label class="field"><span>Repita a nova senha</span><input id="pwNew2" type="password" autocomplete="new-password"></label>
          <p id="pwMsg" class="hint"></p>
          <button id="pwBtn" class="btn primary" data-act="pw-save">Salvar nova senha</button>
        </div></details></section>`
    : `<p class="hint">Neste modo, os dados ficam salvos só neste aparelho e navegador.</p>`;
  $('#dataDlg').innerHTML = `<div class="dlg">
    <div class="dlg-head"><h2>Configurações</h2><button class="btn icon-btn" data-act="close-dlg" aria-label="Fechar">${ic('x',18)}</button></div>
    ${conta}
    <details class="adv"><summary>Avançado: cópia manual e apagar dados</summary><div class="pwform">
      <p class="hint">${cloudOn ? 'Seus dados já ficam guardados na nuvem. Use isto só se precisar de uma cópia em texto. Restaurar ou apagar também altera a nuvem.' : 'Copie o texto para guardar uma cópia dos dados, ou cole uma cópia para restaurar.'}</p>
      <label class="field"><span>Cópia dos dados (texto)</span><textarea id="dataText" rows="5" spellcheck="false">${esc(JSON.stringify(S))}</textarea></label>
      <p id="dataMsg" class="hint"></p>
      <div class="dlg-foot"><button class="btn danger" data-act="wipe">Apagar tudo</button><span class="grow"></span>
        <button class="btn" data-act="copy-data">Copiar</button><button class="btn primary" data-act="restore">Restaurar</button></div>
    </div></details></div>`;
  $('#dataDlg').showModal();
}
async function changePassword(){
  const old = $('#pwOld').value, n1 = $('#pwNew').value, n2 = $('#pwNew2').value, msg = $('#pwMsg'), btn = $('#pwBtn');
  const say = (t, warn=true) => { msg.textContent = t; msg.className = 'hint' + (warn ? ' warn' : ''); };
  if(!old || !n1 || !n2) return say('Preencha os três campos.');
  if(n1.length < 8) return say('A nova senha precisa ter pelo menos 8 caracteres.');
  if(n1 !== n2) return say('As duas senhas novas não são iguais.');
  if(n1 === old) return say('A nova senha precisa ser diferente da atual.');
  btn.disabled = true; say('Alterando…', false);
  try{
    const chk = await sb.auth.signInWithPassword({email:cemail, password:old});     // confirma a senha atual
    if(chk.error) return say('A senha atual está incorreta.');
    const {error} = await sb.auth.updateUser({password:n1});
    if(error) throw error;
    ['pwOld','pwNew','pwNew2'].forEach(id => { $('#'+id).value = ''; });
    say('Senha alterada com sucesso.', false); toast('Senha alterada');
  }catch(e){
    const m = (e && e.message) || '';
    say(/same|different/i.test(m) ? 'A nova senha precisa ser diferente da atual.' : /weak|least|short|characters/i.test(m) ? 'Senha fraca: use mais caracteres, misturando letras e números.' : 'Não foi possível alterar a senha: ' + m);
  }finally{ btn.disabled = false; }
}
function replaceState(obj){
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S, merge(defaults(), obj));
  persist(); applyInbox(); render();
}

/* ============ eventos ============ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, card = el.closest('[data-id]'), id = card && card.dataset.id;
  switch(act){
    case 'nav': view = el.dataset.view; closeDrawers(); render(); window.scrollTo(0,0); break;
    case 'day': setDay(el.dataset.day); break;
    case 'inbox-toggle': toggleInbox(); break;
    case 'dock-toggle': toggleDock(); break;
    case 'close-drawers': closeDrawers(); break;
    case 'totals-collapse': S.ui.totals = !S.ui.totals; persist(); renderDock(); updateTimerUI(); break;
    case 'pomo-collapse': S.ui.pomo = !S.ui.pomo; persist(); renderDock(); updateTimerUI(); break;
    case 'toggle': toggleTask(id); break;
    case 'sub': toggleSub(id, el.dataset.sid); break;
    case 'subs-toggle': expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); break;
    case 'subs-all': { const ids = dayTasks().filter(t=>t.subs.length).map(t=>t.id); const all = ids.every(i=>expanded.has(i)); ids.forEach(i=> all ? expanded.delete(i) : expanded.add(i)); render(); break; }
    case 'done-toggle': showDone = !showDone; render(); break;
    case 'edit': openTask(id); break;
    case 'focus': setFocusTask(id, false); break;
    case 'focus-clear': S.timer.taskId = null; persist(); render(); break;
    case 'to-today': { const t=findTask(id); if(t){ t.due=today(); persist(); render(); } break; }
    case 'new-task': openTask(null, {due: el.dataset.due || dayDue()}); break;
    case 'idea-add': addIdea(); break;
    case 'idea-del': S.ideas = S.ideas.filter(i=>i.id!==id); persist(); render(); break;
    case 'idea-quick': ideaQuick(id, +el.dataset.d); break;
    case 'idea-promote': { const i=S.ideas.find(x=>x.id===id); if(i) openTask(null,{title:i.text, ideaId:i.id, due:dayDue()}); break; }
    case 'r-toggle': toggleRoutine(id); break;
    case 'r-item': toggleRItem(id, el.dataset.iid); break;
    case 'r-edit': { const rr = findRoutine(id); if(rr && rr.kind==='pilar') openPillar(rr.key); else openRoutine(id); break; }
    case 'r-prev': setRday(addDays(rdate(),-1)); break;
    case 'r-next': setRday(addDays(rdate(),1)); break;
    case 'r-today': setRday(null); break;
    case 'r-goto': setRday(el.dataset.d); break;
    case 'r-period': rperiod = el.dataset.p; render(); break;
    case 'fit-act': S.ui.fitAct = el.dataset.name; persist(); render(); break;
    case 'fit-add': addFit(+el.dataset.min); break;
    case 'fit-del': { const T=rdate(), nm=el.dataset.name, removed=S.fitLog.filter(e=>e.date===T && e.activity===nm); S.fitLog=S.fitLog.filter(e=>!(e.date===T && e.activity===nm)); persist(); render(); toast(`Removido de hoje: ${nm}`, ()=>{ S.fitLog.push(...removed); persist(); render(); }); break; }
    case 'fit-new-open': addingAct=true; actDraft=''; render(); { const i=$('#actNew'); if(i) i.focus(); } break;
    case 'fit-new-save': addActivity(); break;
    case 'pages-add': addPages(+el.dataset.n); break;
    case 'book-add-open': addingBook=true; render(); { const i=$('[data-bd="title"]'); if(i) i.focus(); } break;
    case 'book-cancel': addingBook=false; bookDraft={title:'', total:'', offset:''}; render(); break;
    case 'book-save': saveBook(); break;
    case 'book-start': startBook(el.closest('[data-bid]').dataset.bid); break;
    case 'book-finish': finishBook(el.closest('[data-bid]').dataset.bid); break;
    case 'book-del': delBook(el.closest('[data-bid]').dataset.bid); break;
    case 'book-edit': openBook(el.closest('[data-bid]').dataset.bid); break;
    case 'bk-status': bdraft.status = el.dataset.v; renderBookDialog(); break;
    case 'bk-save': saveBookEdit(); break;
    case 'bk-del': if(!delArmed){ delArmed = true; el.textContent = 'Toque de novo para excluir'; } else { const id = bdraft.id; $('#bookDlg').close(); delBook(id); } break;
    case 'meal-set': setMeal(el.dataset.meal, el.dataset.v); break;
    case 'p-save': savePillar(); break;
    case 'p-act-add': pdraft.acts.push({id:uid(), name:''}); $('#pActs').innerHTML = pActsHTML(); { const ins=document.querySelectorAll('#pActs input'); ins[ins.length-1].focus(); } break;
    case 'p-act-del': pdraft.acts = pdraft.acts.filter(a=>a.id!==el.dataset.aid); $('#pActs').innerHTML = pActsHTML(); break;
    case 'r-new': openRoutine(null); break;
    case 'r-convert': openRoutine(id, true); break;
    case 'test-add': addTest(); break;
    case 'r-mode': rdraft.mode = el.dataset.v; renderRoutineDialog(); break;
    case 'r-day': { const d=+el.dataset.d, a=rdraft.days; rdraft.days = a.includes(d) ? a.filter(x=>x!==d) : [...a,d].sort(); renderRoutineDialog(); break; }
    case 'r-item-add': rdraft.items.push({id:uid(), title:''}); $('#rItems').innerHTML = rItemsHTML(); { const ins=document.querySelectorAll('#rItems input'); ins[ins.length-1].focus(); } break;
    case 'r-item-del': rdraft.items = rdraft.items.filter(i=>i.id!==el.dataset.iid); $('#rItems').innerHTML = rItemsHTML(); break;
    case 'r-save': saveRoutine(); break;
    case 'r-del': if(!delArmed){ delArmed=true; el.textContent='Toque de novo para excluir'; } else { S.routines=S.routines.filter(x=>x.id!==rdraft.id); persist(); $('#routineDlg').close(); render(); } break;
    case 'due': draft.due = el.dataset.v; renderTaskDialog(); break;
    case 'level': draft.level = el.dataset.v; renderTaskDialog(); break;
    case 'sub-add': draft.subs.push({id:uid(), title:'', done:false, doneAt:null}); $('#subEdit').innerHTML = subEditHTML(); refreshValidation(); { const ins=document.querySelectorAll('#subEdit input'); ins[ins.length-1].focus(); } break;
    case 'sub-del': draft.subs = draft.subs.filter(s=>s.id!==el.dataset.sid); $('#subEdit').innerHTML = subEditHTML(); refreshValidation(); break;
    case 'save-task': saveTask(); break;
    case 'del-task': if(!delArmed){ delArmed=true; el.textContent='Toque de novo para excluir'; } else { S.tasks=S.tasks.filter(t=>t.id!==draft.id); if(S.timer.taskId===draft.id) S.timer.taskId=null; persist(); $('#taskDlg').close(); render(); } break;
    case 'close-dlg': el.closest('dialog').close(); break;
    case 'undo': if(undoFn){ undoFn(); undoFn=null; $('#toast').hidden=true; } break;
    case 'mode': setMode(el.dataset.mode); break;
    case 't-toggle': S.timer.running ? pauseTimer() : startTimer(); break;
    case 't-reset': resetTimer(); break;
    case 'pip': togglePip(); break;
    case 'zen': closeDrawers(); openZen(); break;
    case 'zen-close': closeZen(); break;
    case 't-skip': skipTimer(); break;
    case 'data': openData(); break;
    case 'sync-now': pullSince(); pushNow(); break;
    case 'logout': logout(); break;
    case 'pw-save': changePassword(); break;
    case 'login': doLogin(); break;
    case 'copy-data': { const ta=$('#dataText'); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(err){} $('#dataMsg').textContent = ok ? 'Copiado.' : 'Selecione o texto e copie manualmente.'; break; }
    case 'restore': try{ const o=JSON.parse($('#dataText').value); if(!Array.isArray(o.tasks)) throw 0; replaceState(o); $('#dataDlg').close(); toast('Backup restaurado'); }catch(err){ $('#dataMsg').textContent='Texto inválido. Cole o backup completo.'; $('#dataMsg').className='hint warn'; } break;
    case 'wipe': if(!wipeArmed){ wipeArmed=true; el.textContent='Toque de novo para apagar'; } else { replaceState({}); $('#dataDlg').close(); toast('Tudo apagado'); } break;
  }
});
document.addEventListener('keydown', e=>{
  const t = e.target, ds = t.dataset || {};
  if(e.key==='Escape'){ closeDrawers(); if(zenOpen) closeZen(); }
  if(zenOpen && e.code==='Space' && t.tagName!=='BUTTON' && t.tagName!=='INPUT'){ e.preventDefault(); S.timer.running ? pauseTimer() : startTimer(); }
  if((t.id==='lgPass' || t.id==='lgEmail') && e.key==='Enter'){ e.preventDefault(); doLogin(); }
  else if(t.id==='ideaInput' && e.key==='Enter'){ e.preventDefault(); addIdea(); }
  else if(t.id==='testInput' && e.key==='Enter'){ e.preventDefault(); addTest(); }
  else if(ds.sub && e.key==='Enter'){
    e.preventDefault(); draft.subs.push({id:uid(), title:'', done:false, doneAt:null});
    $('#subEdit').innerHTML = subEditHTML(); refreshValidation();
    const ins = document.querySelectorAll('#subEdit input'); ins[ins.length-1].focus();
  }
  else if(ds.ritem && e.key==='Enter'){
    e.preventDefault(); rdraft.items.push({id:uid(), title:''}); $('#rItems').innerHTML = rItemsHTML();
    const ins = document.querySelectorAll('#rItems input'); ins[ins.length-1].focus();
  }
  else if(t.id==='actNew' && e.key==='Enter'){ e.preventDefault(); addActivity(); }
  else if(t.id==='actNew' && e.key==='Escape'){ addingAct=false; actDraft=''; render(); }
  else if(ds.bd==='title' && e.key==='Enter'){ e.preventDefault(); saveBook(); }
  else if(ds.pact && e.key==='Enter'){ e.preventDefault(); pdraft.acts.push({id:uid(), name:''}); $('#pActs').innerHTML = pActsHTML(); const ins=document.querySelectorAll('#pActs input'); ins[ins.length-1].focus(); }
  else if(t.id==='fTitle' && e.key==='Enter'){ e.preventDefault(); saveTask(); }
  else if(ds.note && e.key==='Enter'){ t.blur(); }
  else if((e.key==='ArrowLeft' || e.key==='ArrowRight') && t.closest && t.closest('.daynav')){
    const i = DAYS.indexOf(day) + (e.key==='ArrowRight' ? 1 : -1);
    if(DAYS[i]){ setDay(DAYS[i]); const b=$(`.daynav [data-day="${DAYS[i]}"]`); if(b) b.focus(); }
  }
});
document.addEventListener('input', e=>{
  const el = e.target, ds = el.dataset || {};
  if(ds.bd){ bookDraft[ds.bd] = el.value; return; }
  if(ds.bk){ bdraft[ds.bk] = el.value; refreshBook(); return; }
  if(el.id==='actNew'){ actDraft = el.value; return; }
  if(ds.pf==='goal'){ pdraft.goal = el.value; return; }
  if(ds.pact){ const a = pdraft.acts.find(x=>x.id===ds.pact); if(a) a.name = el.value; return; }
  if(ds.f==='title'){ draft.title=el.value; refreshValidation(); }
  else if(ds.f==='notes'){ draft.notes=el.value; }
  else if(ds.sub){ const s=draft.subs.find(x=>x.id===ds.sub); if(s){ s.title=el.value; refreshValidation(); } }
  else if(ds.rf==='title'){ rdraft.title=el.value; refreshRoutine(); }
  else if(ds.rf==='goal'){ rdraft.goal=parseInt(el.value,10)||0; refreshRoutine(); }
  else if(ds.ritem){ const it=rdraft.items.find(x=>x.id===ds.ritem); if(it) it.title=el.value; }
});
document.addEventListener('change', e=>{
  const el = e.target, ds = el.dataset || {};
  if(el.id==='rdateInput'){ setRday(el.value || null); }
  else if(ds.f==='due'){ draft.due = el.value || today(); renderTaskDialog(); }
  else if(el.id==='focusTask'){ S.timer.taskId = el.value || null; persist(); render(); }
  else if(ds.pipAuto !== undefined){ S.ui.pipAuto = el.checked; persist(); }
  else if(ds.note){
    const card = el.closest('[data-id]'), T = rdate();
    if(card){ S.routineNote[T] = S.routineNote[T] || {}; if(el.value.trim()) S.routineNote[T][card.dataset.id] = el.value.trim(); else delete S.routineNote[T][card.dataset.id]; persist(); }
  }
  else if(ds.set){
    const v = Math.max(1, Math.min(+el.max||180, parseInt(el.value,10)||S.settings[ds.set]));
    S.settings[ds.set] = v; el.value = v;
    if(!S.timer.running && ds.set===S.timer.mode) S.timer.remaining = modeMs(S.timer.mode);
    persist(); render();
  }
});
document.addEventListener('toggle', e=>{ const c = e.target && e.target.classList; if(!c) return; if(c.contains('adj')) adjOpen = e.target.open; else if(c.contains('lidos')) lidosOpen = e.target.open; }, true);
['taskDlg','routineDlg','dataDlg','pillarDlg','bookDlg'].forEach(id=>{
  const d = $('#'+id);
  d.addEventListener('click', e=>{ if(e.target===d) d.close(); });
});

/* ============ arrastar tarefa para o foco ============ */
document.addEventListener('dragstart', e=>{
  const c = e.target.closest && e.target.closest('.task[draggable="true"]'); if(!c) return;
  dragId = c.dataset.id;
  try{ e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; }catch(err){}
  document.body.classList.add('dragging'); c.classList.add('drag-src');
});
document.addEventListener('dragend', ()=>{
  dragId = null; document.body.classList.remove('dragging');
  document.querySelectorAll('.drag-src,.over').forEach(x=>x.classList.remove('drag-src','over'));
});
document.addEventListener('dragover', e=>{
  const z = e.target.closest && e.target.closest('[data-drop="focus"]');
  if(z && dragId){ e.preventDefault(); try{ e.dataTransfer.dropEffect = 'move'; }catch(err){} z.classList.add('over'); }
});
document.addEventListener('dragleave', e=>{
  const z = e.target.closest && e.target.closest('[data-drop="focus"]');
  if(z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', e=>{
  const z = e.target.closest && e.target.closest('[data-drop="focus"]');
  if(!z || !dragId) return;
  e.preventDefault(); const id = dragId; dragId = null;
  document.body.classList.remove('dragging');
  setFocusTask(id, true);
});

/* deslizar para os lados troca D+0 / D+1 / D+n no celular */
let tx = 0, ty = 0, tOK = false;
$('#main').addEventListener('touchstart', e=>{ const p=e.touches[0]; tx=p.clientX; ty=p.clientY; tOK = view==='atividades' && !e.target.closest('input,textarea,select'); }, {passive:true});
$('#main').addEventListener('touchend', e=>{
  if(!tOK) return; const p=e.changedTouches[0], dx=p.clientX-tx, dy=p.clientY-ty;
  if(Math.abs(dx)>70 && Math.abs(dy)<45){ const k = DAYS[DAYS.indexOf(day)+(dx<0?1:-1)]; if(k) setDay(k); }
}, {passive:true});

function boot(){ if(S.timer.running && timerRemaining()<=0) finishTimer(false); else render(); }
applyInbox();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
(async()=>{ const handled = await cloudBoot(); if(!handled) boot(); })();
</script>

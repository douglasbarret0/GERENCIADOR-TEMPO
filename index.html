<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciador de Tempo</title>
<meta name="theme-color" content="#0E6B4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tempo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --ink:#17231D; --ink-2:#55635A; --line:#D6DDD1; --soft:#E3EAE0;
  --brand:#0E6B4A; --brand-ink:#FFFFFF; --signal:#F5C518; --signal-ink:#2F2500; --signal-strong:#B58900;
  --danger:#B3261E; --shadow:0 calc(1px * var(--u)) calc(2px * var(--u)) rgba(20,35,25,.06);
  --u:1; --ctl:calc(44px * var(--u)); --fs:calc(16px * var(--u)); --topH:calc(56px * var(--u)); --chk:calc(26px * var(--u)); --dp:calc(5px * var(--u));
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1511; --surface:#17201A; --ink:#E7EFE8; --ink-2:#9AABA0; --line:#283529; --soft:#1F2B22;
    --brand:#3FBF8A; --brand-ink:#04241A; --signal:#F5C518; --signal-ink:#2F2500; --signal-strong:#F5C518;
    --danger:#FF8F86; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#17201A; --ink:#E7EFE8; --ink-2:#9AABA0; --line:#283529; --soft:#1F2B22;
  --brand:#3FBF8A; --brand-ink:#04241A; --signal:#F5C518; --signal-ink:#2F2500; --signal-strong:#F5C518;
  --danger:#FF8F86; --shadow:none; color-scheme:dark;
}
@media (min-width:821px){ :root{--ctl:calc(34px * var(--u)); --fs:calc(14px * var(--u)); --topH:calc(50px * var(--u)); --chk:calc(20px * var(--u)); --dp:calc(4px * var(--u))} }
@media (min-width:1900px){ :root{--u:1.1} }
@media (min-width:2400px){ :root{--u:1.3} }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:calc(3px * var(--u)) solid var(--signal-strong);outline-offset:calc(2px * var(--u))}
[hidden]{display:none!important}

/* ---------- estrutura ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;height:var(--topH);display:flex;align-items:center;gap:calc(18px * var(--u));padding:0 calc(16px * var(--u));background:var(--surface);border-bottom:calc(1px * var(--u)) solid var(--line)}
.brand{font:700 calc(17px * var(--u))/1.1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.tabs{display:flex;gap:calc(4px * var(--u));flex:1}
.tab{position:relative;display:flex;align-items:center;gap:calc(7px * var(--u));padding:0 calc(12px * var(--u));border-radius:calc(10px * var(--u));border:0;background:none;color:var(--ink-2);font-weight:600;font-size:var(--fs);cursor:pointer;min-height:var(--ctl)}
.tab:hover{background:var(--soft)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tab .count{font-style:normal;font-size:calc(11px * var(--u));font-weight:700;background:var(--soft);color:var(--ink);padding:0 calc(7px * var(--u));border-radius:calc(99px * var(--u))}
.tab[aria-current="page"] .count{background:var(--signal);color:var(--signal-ink)}
.tab-ideas,.tab-dock{display:none}
.top-actions{display:flex;gap:calc(8px * var(--u));align-items:center}
.body{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.left{position:sticky;top:calc(var(--topH) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--topH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-right:calc(1px * var(--u)) solid var(--line)}
.main{padding:calc(18px * var(--u)) clamp(calc(14px * var(--u)),2vw,calc(26px * var(--u))) calc(48px * var(--u));min-width:0}
.narrow{max-width:calc(880px * var(--u))}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:calc(16px * var(--u));margin-bottom:calc(14px * var(--u));flex-wrap:wrap}
h1{margin:0;font:700 calc(24px * var(--u))/1.1 var(--display);letter-spacing:-.025em}
.sub{margin:calc(4px * var(--u)) 0 0;color:var(--ink-2)}

/* ---------- painel de ideias (esquerda) ---------- */
.inbox{width:calc(264px * var(--u));height:100%;display:flex;flex-direction:column;gap:calc(10px * var(--u));padding:calc(14px * var(--u)) calc(12px * var(--u)) 0}
.inbox-head{display:flex;align-items:center;gap:calc(8px * var(--u))}
.inbox-head h2{margin:0;font:700 calc(17px * var(--u)) var(--display);letter-spacing:-.02em;flex:1}
.badge{font-size:calc(11px * var(--u));font-weight:700;background:var(--soft);padding:calc(1px * var(--u)) calc(8px * var(--u));border-radius:calc(99px * var(--u))}
.capture{display:flex;gap:calc(6px * var(--u))}
.capture input{flex:1;min-width:0}
.idea-list{flex:1;overflow:auto;display:grid;gap:calc(6px * var(--u));align-content:start;padding-bottom:calc(20px * var(--u))}
.idea{display:grid;gap:calc(6px * var(--u));padding:calc(8px * var(--u)) calc(10px * var(--u));background:var(--surface);border:calc(1px * var(--u)) solid var(--line);border-radius:calc(10px * var(--u))}
.idea p{margin:0;overflow-wrap:anywhere;line-height:1.35}
.idea-actions{display:flex;align-items:center;gap:calc(5px * var(--u));flex-wrap:wrap}
.idea time{margin-left:auto;font-size:calc(11px * var(--u));color:var(--ink-2)}
.mini{border:calc(1px * var(--u)) solid var(--line);background:var(--surface);border-radius:calc(8px * var(--u));padding:0 calc(9px * var(--u));font-size:calc(12px * var(--u));font-weight:600;cursor:pointer;min-height:calc(26px * var(--u))}
.mini:hover{border-color:var(--ink-2)}
.mini.d{font-weight:700}
.rail{display:none;width:calc(44px * var(--u));height:100%;border:0;background:transparent;cursor:pointer;flex-direction:column;align-items:center;gap:calc(10px * var(--u));padding:calc(14px * var(--u)) 0;color:var(--ink-2)}
.rail:hover{background:var(--soft)}
.rail span.v{writing-mode:vertical-rl;font:600 calc(13px * var(--u)) var(--body)}
.scrim{display:none;position:fixed;inset:0;background:rgba(8,18,12,.5);z-index:55}
@media (min-width:821px){
  body.inbox-collapsed .inbox{display:none}
  body.inbox-collapsed .rail{display:flex}
}

/* ---------- painel da direita: totais e foco ---------- */
.dock{width:calc(296px * var(--u));position:sticky;top:calc(var(--topH) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--topH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;border-left:calc(1px * var(--u)) solid var(--line);padding:calc(12px * var(--u))}
.dock-top{display:none}
#dockBody{display:grid;gap:calc(12px * var(--u));align-content:start}
.card{background:var(--surface);border:calc(1px * var(--u)) solid var(--line);border-radius:calc(14px * var(--u));padding:calc(12px * var(--u));display:grid;gap:calc(10px * var(--u))}
.card-head{display:flex;align-items:center;gap:calc(6px * var(--u))}
.card-head h2{margin:0;font:700 calc(15px * var(--u)) var(--display);letter-spacing:-.01em;flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:calc(8px * var(--u))}
.kpi{background:var(--bg);border-radius:calc(10px * var(--u));padding:calc(8px * var(--u)) calc(10px * var(--u))}
.kpi b{display:block;font:700 calc(21px * var(--u))/1.1 var(--display);letter-spacing:-.02em}
.kpi b.bad{color:var(--danger)}
.kpi small{color:var(--ink-2);font-size:calc(11.5px * var(--u))}
.bars{display:flex;align-items:flex-end;gap:calc(5px * var(--u));height:calc(62px * var(--u))}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:calc(3px * var(--u))}
.bcol i{display:block;width:100%;max-width:calc(24px * var(--u));background:var(--line);border-radius:calc(4px * var(--u)) calc(4px * var(--u)) calc(2px * var(--u)) calc(2px * var(--u));min-height:calc(3px * var(--u))}
.bcol.now i{background:var(--brand)}
.bcol span{font-size:calc(10.5px * var(--u));color:var(--ink-2)}
.chart-t{font-size:calc(11.5px * var(--u));color:var(--ink-2);margin:0}
.tot-body{display:grid;gap:calc(10px * var(--u))}
.tot.is-collapsed .tot-body{display:none}
.lvrow{display:flex;justify-content:space-between;gap:calc(6px * var(--u));font-size:calc(12px * var(--u));padding-top:calc(6px * var(--u));border-top:calc(1px * var(--u)) solid var(--line)}
.lvrow span{display:inline-flex;align-items:center;gap:calc(5px * var(--u))}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:calc(12.5px * var(--u));padding:calc(4px * var(--u)) 0;border-top:calc(1px * var(--u)) solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums}
.pomo-mini{font:700 calc(14px * var(--u)) var(--display);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pomo:not(.is-collapsed) .pomo-mini,.pomo:not(.is-collapsed) .pomo-play{display:none}
.pomo.is-collapsed .card-body{display:none}
.card-body{display:grid;gap:calc(10px * var(--u));justify-items:center}
.card-body>*{width:100%}
.modes{display:flex;background:var(--soft);border-radius:calc(10px * var(--u));padding:calc(3px * var(--u));gap:calc(2px * var(--u))}
.modes button{flex:1;border:0;background:none;padding:calc(5px * var(--u)) calc(4px * var(--u));border-radius:calc(8px * var(--u));font-weight:600;font-size:calc(12px * var(--u));color:var(--ink-2);cursor:pointer;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ring{position:relative;width:calc(128px * var(--u));aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--soft)}
.ring .arc{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring .arc.break{stroke:var(--signal-strong)}
.ring-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.time{font:700 calc(30px * var(--u))/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mode-name{color:var(--ink-2);margin-top:calc(3px * var(--u));font-weight:600;font-size:calc(12px * var(--u))}
.controls{display:flex;gap:calc(6px * var(--u))}
.controls .primary{flex:1}
.cycle{display:flex;gap:calc(6px * var(--u));justify-content:center}
.cycle i{width:calc(9px * var(--u));height:calc(9px * var(--u));border-radius:50%;border:calc(2px * var(--u)) solid var(--ink-2);display:block}
.cycle i.on{background:var(--brand);border-color:var(--brand)}
.drop{border:calc(1.5px * var(--u)) dashed var(--ink-2);border-radius:calc(10px * var(--u));padding:0 calc(10px * var(--u));min-height:calc(42px * var(--u));font-size:calc(13px * var(--u));color:var(--ink-2);display:flex;align-items:center;gap:calc(6px * var(--u));transition:background .15s,border-color .15s}
.drop.has{border-style:solid;border-color:var(--brand);color:var(--ink);background:var(--soft);font-weight:600}
.drop .dt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dragging .pomo{outline:calc(2px * var(--u)) dashed var(--signal-strong);outline-offset:calc(3px * var(--u))}
.pomo.over,.drop.over{background:rgba(245,197,24,.2);border-color:var(--signal-strong)}
.stat-line{font-size:calc(12.5px * var(--u));color:var(--ink-2);text-align:center}
.adj summary{cursor:pointer;font-size:calc(12.5px * var(--u));font-weight:600;color:var(--ink-2)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:calc(8px * var(--u));margin-top:calc(8px * var(--u))}
.settings label{display:grid;gap:calc(3px * var(--u));font-size:calc(12px * var(--u));color:var(--ink-2)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(7px * var(--u));border:calc(1px * var(--u)) solid var(--line);background:var(--surface);padding:0 calc(14px * var(--u));border-radius:calc(10px * var(--u));font-weight:600;font-size:var(--fs);cursor:pointer;min-height:var(--ctl)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{padding:0;width:var(--ctl)}
.ghost{background:none;border:0;color:var(--ink-2);width:calc(34px * var(--u));height:calc(34px * var(--u));border-radius:calc(8px * var(--u));display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
.ghost.sm{width:calc(28px * var(--u));height:calc(28px * var(--u))}
.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.on{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.chk{display:flex;gap:calc(8px * var(--u));align-items:center;font-size:calc(12.5px * var(--u));color:var(--ink-2);margin-top:calc(8px * var(--u));cursor:pointer}
.chk input{width:auto;min-height:0;accent-color:var(--brand)}
.ghost.on{background:var(--signal);color:var(--signal-ink)}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:calc(12px * var(--u));cursor:pointer}
.lnk:hover{text-decoration:underline}
.chip-timer{display:inline-flex;align-items:center;gap:calc(6px * var(--u));background:var(--signal);color:var(--signal-ink);border:0;border-radius:calc(99px * var(--u));padding:0 calc(13px * var(--u));font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;min-height:var(--ctl)}
.chip-timer.idle{display:none;background:var(--soft);color:var(--ink)}
.fab{position:fixed;right:calc(16px * var(--u));bottom:calc(calc(84px * var(--u)) + env(safe-area-inset-bottom,0px));width:calc(56px * var(--u));height:calc(56px * var(--u));border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);box-shadow:0 calc(6px * var(--u)) calc(18px * var(--u)) rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:20}

/* ---------- seletor deslizante D+ ---------- */
.daynav{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:calc(13px * var(--u));padding:var(--dp);isolation:isolate;width:calc(380px * var(--u));max-width:100%;--i:0}
.daypill{position:absolute;top:var(--dp);bottom:var(--dp);left:var(--dp);width:calc((100% - 2 * var(--dp))/3);border-radius:calc(10px * var(--u));background:var(--signal);transform:translateX(calc(var(--i) * 100%));transition:transform .3s cubic-bezier(.3,.8,.25,1);z-index:-1;box-shadow:0 calc(1px * var(--u)) calc(3px * var(--u)) rgba(0,0,0,.15)}
.daynav button{background:none;border:0;padding:0 calc(4px * var(--u));border-radius:calc(10px * var(--u));color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:calc(6px * var(--u));cursor:pointer;min-height:calc(36px * var(--u));white-space:nowrap}
.daynav button[aria-selected="true"]{color:var(--signal-ink)}
.dtag{font:700 calc(16px * var(--u))/1.1 var(--display);letter-spacing:-.02em}
.dname{font:700 calc(15px * var(--u))/1.1 var(--display);letter-spacing:.005em;display:inline-flex;align-items:center;gap:calc(6px * var(--u))}
.daynav em{font-style:normal;font-size:calc(11px * var(--u));font-weight:700;background:var(--line);color:var(--ink);padding:0 calc(6px * var(--u));border-radius:calc(99px * var(--u))}
.daynav button[aria-selected="true"] em{background:rgba(47,37,0,.16);color:var(--signal-ink)}
.daybar{display:flex;align-items:center;gap:calc(12px * var(--u));margin:0 0 calc(6px * var(--u));flex-wrap:wrap}
.daydate{color:var(--ink-2);font-weight:600}
.daycount{font-size:calc(12.5px * var(--u));color:var(--ink-2)}
.progress{height:calc(6px * var(--u));background:var(--soft);border-radius:calc(99px * var(--u));overflow:hidden}
.progress.inl{width:calc(170px * var(--u))}
.progress.sm{height:calc(5px * var(--u));margin-top:calc(8px * var(--u))}
.progress>span{display:block;height:100%;background:var(--brand);border-radius:calc(99px * var(--u));transition:width .35s}
.grow{flex:1}

/* ---------- lista de tarefas ---------- */
h2.sec{margin:calc(16px * var(--u)) 0 calc(7px * var(--u));font:600 calc(12.5px * var(--u))/1.2 var(--body);color:var(--ink-2);display:flex;align-items:center;gap:calc(8px * var(--u))}
h2.sec.late{color:var(--danger)}
h2.sec .dtag2{font:700 calc(12.5px * var(--u)) var(--display);background:var(--soft);color:var(--ink);padding:calc(2px * var(--u)) calc(8px * var(--u));border-radius:calc(7px * var(--u))}
.sec-note{margin:-2px 0 calc(8px * var(--u));font-size:calc(12.5px * var(--u));color:var(--ink-2)}
.list{display:grid;gap:calc(5px * var(--u))}
.task{display:flex;gap:calc(10px * var(--u));align-items:flex-start;padding:calc(7px * var(--u)) calc(10px * var(--u));background:var(--surface);border:calc(1px * var(--u)) solid var(--line);border-radius:calc(11px * var(--u))}
.task[draggable="true"]{cursor:grab}
.task.drag-src{opacity:.45}
.task.in-focus{border-color:var(--signal-strong);box-shadow:inset 0 0 0 calc(1px * var(--u)) var(--signal-strong)}
.task-main{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:calc(4px * var(--u)) calc(10px * var(--u));flex-wrap:wrap}
.task-title{background:none;border:0;padding:0;font-weight:600;font-size:calc(var(--fs) + calc(.5px * var(--u)));line-height:1.3;text-align:left;cursor:pointer;color:inherit;flex:1 1 100%;min-width:0}
.task.is-done .task-title{text-decoration:line-through;color:var(--ink-2)}
.tmeta,.meta{display:flex;align-items:center;flex-wrap:wrap;gap:calc(3px * var(--u)) calc(12px * var(--u));font-size:calc(12px * var(--u));color:var(--ink-2)}
.meta{margin-top:calc(3px * var(--u))}
.tmeta .late{color:var(--danger);font-weight:600}
.done-at{color:var(--brand);font-weight:600}
.focus-tag{background:var(--signal);color:var(--signal-ink);font-weight:700;padding:0 calc(7px * var(--u));border-radius:calc(99px * var(--u));font-size:calc(11px * var(--u))}
.pmc{display:inline-flex;align-items:center;gap:calc(3px * var(--u))}
.subchip{display:inline-flex;align-items:center;gap:calc(2px * var(--u));background:var(--soft);border:0;border-radius:calc(99px * var(--u));padding:calc(1px * var(--u)) calc(8px * var(--u)) calc(1px * var(--u)) calc(4px * var(--u));font-size:calc(12px * var(--u));font-weight:600;cursor:pointer;color:var(--ink)}
.subchip svg{transition:transform .15s}
.subchip[aria-expanded="true"] svg{transform:rotate(90deg)}
.check{flex-shrink:0;width:var(--chk);height:var(--chk);margin-top:calc(1px * var(--u));border-radius:50%;border:calc(2px * var(--u)) solid var(--ink-2);background:transparent;color:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.check svg{width:calc(var(--chk) * .55);height:calc(var(--chk) * .55)}
.check:hover{border-color:var(--brand)}
.check[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

<script>
/* ============ utilidades ============ */
const $ = (s, r=document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parts = s => s.split('-').map(Number);
const addDays = (s,n) => { const [y,m,d]=parts(s); return ymd(new Date(y,m-1,d+n)); };
const diff = (a,b) => { const pa=parts(a), pb=parts(b); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5); };
const dow = s => { const [y,m,d]=parts(s); return new Date(y,m-1,d).getDay(); };
const weekStart = s => addDays(s, -((dow(s)+6)%7));   // semana começa na segunda
const hhmm = iso => { const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dateOf = iso => ymd(new Date(iso));
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const WDL = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MONL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fullDate = s => { const [y,m,d]=parts(s); return `${WDL[dow(s)]}, ${d} de ${MONL[m-1]}`; };
const shortDate = s => { const [y,m,d]=parts(s); return `${WD[dow(s)]}, ${pad(d)}/${pad(m)}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const isMobile = () => mq('(max-width:820px)');
const narrowDock = () => mq('(max-width:1099px)');

const ICONS = {
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
  leaf:'<path d="M5 19C5 10 10 5 20 5c0 10-5 15-14 15"/><path d="M5 19l8-8"/>',
  chevR:'<path d="M9 5l7 7-7 7"/>',
  chevL:'<path d="M15 5l-7 7 7 7"/>',
  chevD:'<path d="M6 9l6 6 6-6"/>',
  play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
  pause:'<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  pip:'<rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/>',
  skip:'<path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/>',
  dots:'<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>'
};
const ic = (n, sz=18, sw=2.2) => `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" style="width:calc(${sz}px * var(--u));height:calc(${sz}px * var(--u))" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ============ modelo de rotinas ============ */
const ALLDAYS = [0,1,2,3,4,5,6];
const PILARES = {
  fisica:      {title:'Atividade física', icon:'pulse', mode:'weekly', goal:4, days:ALLDAYS, items:[], ph:'Ex.: treino A, 50 min'},
  leitura:     {title:'Leitura',          icon:'book',  mode:'days',   goal:5, days:ALLDAYS, items:[], ph:'Livro e páginas lidas'},
  alimentacao: {title:'Boa alimentação',  icon:'leaf',  mode:'days',   goal:5, days:ALLDAYS, items:[], ph:'Algo a registrar?'}
};
const mkPilar = k => { const p = PILARES[k]; return {id:'pilar-'+k, kind:'pilar', key:k, title:p.title, mode:p.mode, goal:p.goal, days:[...p.days], items:p.items.map(t=>({id:uid(), title:t})), createdAt:today()}; };

/* normaliza dados (também migra backups de versões anteriores) */
function normalize(s){
  s.ui = {ideas:true, pomo:true, totals:(window.innerHeight >= 840), ...(s.ui||{})};
  s.routineItemLog = s.routineItemLog || {};
  s.routineNote = s.routineNote || {};
  s.routines = (s.routines||[]).map(r=>({kind:'rotina', mode:'days', goal:3, days:[...ALLDAYS], items:[], createdAt:today(), ...r}));
  const missing = Object.keys(PILARES).filter(k=>!s.routines.some(r=>r.kind==='pilar' && r.key===k)).map(mkPilar);
  s.routines = [...missing, ...s.routines];
  s.routines.forEach(r=>{ if(r.kind==='pilar'){ r.id = 'pilar-' + r.key; r.items = []; } });
  { const seen = new Set(); s.routines = s.routines.filter(r=>{ if(r.kind!=='pilar') return true; if(seen.has(r.key)) return false; seen.add(r.key); return true; }); }
  s.goals = {fisicaMin:150, leituraPag:10, alimSaud:3, ...(s.goals||{})};
  s.activities = Array.isArray(s.activities) ? s.activities : ['Musculação','Corrida','Caminhada','Bicicleta','Natação','Alongamento'];
  s.fitLog = s.fitLog || []; s.books = s.books || []; s.readLog = s.readLog || []; s.mealLog = s.mealLog || {};
  return s;
}

/* ============ nuvem (Supabase) ============
   Preencha CLOUD.url e CLOUD.key (URL do projeto e chave pública) para ligar o login
   e a sincronização entre aparelhos. Com os dois vazios, o app funciona só neste aparelho. */
const CLOUD = {url:'https://tasmjykkfmzivmoaflhb.supabase.co', key:'sb_publishable_h7mC-zqzI587fCAmr4mzOw_0k3cvHa2'};
const cloudWanted = !!(CLOUD.url && CLOUD.key);
const cloudOn = cloudWanted && !!window.supabase;
const META_KEY = 'afazeres.sync.v1';
const ARRAYS = {task:'tasks', idea:'ideas', routine:'routines', fit:'fitLog', read:'readLog', book:'books', pomo:'pomoLog'};
let cemail = '', sb = null, cuid = null, cloudReady = false, syncedOnce = false, metaUid = null, synced = new Map(), lastPull = null;
let pushing = false, pushAgain = false, pushTimer = null, chan = null, syncStatus = cloudOn ? 'sync' : 'off', syncMsg = '', renderTimer = null, legacy = null;

(function loadMeta(){
  try{ const m = JSON.parse(localStorage.getItem(META_KEY) || 'null');
    if(m){ synced = new Map(Object.entries(m.synced || {})); lastPull = m.lastPull || null; syncedOnce = !!m.once; metaUid = m.uid || null; }
  }catch(e){}
})();
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify({once:syncedOnce, uid:cuid, lastPull, synced:Object.fromEntries(synced)})); }catch(e){} }

/* estado <-> registros. Cada item vira uma linha na tabela "items" (tipo, id, dados em JSON) */
function canon(v){   // ordena as chaves para a comparação não depender da ordem dos campos
  if(Array.isArray(v)) return v.map(canon);
  if(v && typeof v === 'object'){ const o = {}; Object.keys(v).sort().forEach(k => { o[k] = canon(v[k]); }); return o; }
  return v;
}
function toRecords(st){
  const m = new Map(), put = (kind, id, data) => m.set(kind + '/' + id, JSON.stringify(canon(data)));
  for(const [kind, arr] of Object.entries(ARRAYS)) (st[arr] || []).forEach(x => put(kind, x.id, x));
  for(const [d, ms] of Object.entries(st.mealLog || {})) for(const [k, v] of Object.entries(ms)) put('meal', `${d}|${k}`, {date:d, k, v:v.v, at:v.at});
  for(const [d, l] of Object.entries(st.routineLog || {})) for(const [rid, at] of Object.entries(l)) put('rlog', `${d}|${rid}`, {date:d, rid, at});
  for(const [d, l] of Object.entries(st.routineItemLog || {})) for(const [rid, its] of Object.entries(l)) for(const [iid, at] of Object.entries(its)) put('ritem', `${d}|${rid}|${iid}`, {date:d, rid, iid, at});
  for(const [d, l] of Object.entries(st.routineNote || {})) for(const [rid, text] of Object.entries(l)) put('rnote', `${d}|${rid}`, {date:d, rid, text});
  put('cfg', 'goals', st.goals); put('cfg', 'activities', {list:st.activities}); put('cfg', 'settings', st.settings);
  return m;
}
function applyRec(st, kind, id, data, del){
  if(ARRAYS[kind]){
    const a = (st[ARRAYS[kind]] = st[ARRAYS[kind]] || []), i = a.findIndex(x => x.id === id);
    if(del){ if(i >= 0) a.splice(i, 1); } else if(i >= 0) a[i] = data; else a.push(data);
    return;
  }
  const [d, b, c] = id.split('|');
  const nest = (root) => (st[root] = st[root] || {});
  if(kind==='meal'){ const r = nest('mealLog'), m = (r[d] = r[d] || {}); if(del) delete m[b]; else m[b] = {v:data.v, at:data.at}; if(!Object.keys(m).length) delete r[d]; }
  else if(kind==='rlog'){ const r = nest('routineLog'), m = (r[d] = r[d] || {}); if(del) delete m[b]; else m[b] = data.at; if(!Object.keys(m).length) delete r[d]; }
  else if(kind==='rnote'){ const r = nest('routineNote'), m = (r[d] = r[d] || {}); if(del) delete m[b]; else m[b] = data.text; if(!Object.keys(m).length) delete r[d]; }
  else if(kind==='ritem'){
    const r = nest('routineItemLog'), l = (r[d] = r[d] || {}), m = (l[b] = l[b] || {});
    if(del) delete m[c]; else m[c] = data.at;
    if(!Object.keys(m).length) delete l[b]; if(!Object.keys(l).length) delete r[d];
  }
  else if(kind==='cfg'){ if(del) return; if(id==='goals') st.goals = data; else if(id==='activities') st.activities = data.list; else if(id==='settings') st.settings = data; }
}
function buildState(recs, keep){
  const st = {tasks:[], ideas:[], routines:[], fitLog:[], readLog:[], books:[], pomoLog:[], mealLog:{}, routineLog:{}, routineItemLog:{}, routineNote:{},
              ui:keep.ui, timer:keep.timer, settings:keep.settings, goals:keep.goals, activities:keep.activities};
  for(const [key, data] of recs){ const i = key.indexOf('/'); applyRec(st, key.slice(0, i), key.slice(i + 1), data, false); }
  return st;
}
function sortState(st){
  const by = k => (a, b) => String(a[k] || '').localeCompare(String(b[k] || ''));
  st.tasks.sort(by('createdAt')); st.ideas.sort(by('createdAt')); st.books.sort(by('addedAt'));
  st.fitLog.sort(by('at')); st.readLog.sort(by('at')); st.pomoLog.sort(by('at'));
  const order = {fisica:0, leitura:1, alimentacao:2};
  st.routines.sort((a, b) => (a.kind==='pilar' ? order[a.key] : 9) - (b.kind==='pilar' ? order[b.key] : 9) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
}
const replaceLocal = obj => { Object.keys(S).forEach(k => delete S[k]); Object.assign(S, obj); };

/* estado da sincronização */
const STATUS_TXT = {off:'Modo local', ok:'Sincronizado', sync:'Sincronizando…', pending:'Alterações pendentes…', offline:'Sem conexão. As alterações ficam salvas neste aparelho e são enviadas depois.', error:'Erro ao sincronizar'};
const syncText = () => STATUS_TXT[syncStatus] + (syncStatus==='error' && syncMsg ? ': ' + syncMsg : '');
function setStatus(s, msg){
  syncStatus = s; syncMsg = msg || '';
  const el = document.getElementById('syncStat');
  if(el){ el.className = 'sync s-' + s; el.title = syncText(); el.setAttribute('aria-label', syncText()); }
  const m = document.getElementById('syncMsg'); if(m) m.textContent = syncText();
}
function scheduleRender(){ clearTimeout(renderTimer); renderTimer = setTimeout(render, 250); }

/* envio: compara o estado atual com o que já foi sincronizado e manda só a diferença */
function schedulePush(){ if(!cloudReady) return; clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 500); if(!pushing) setStatus('pending'); }
const rowOf = (key, data, del) => { const i = key.indexOf('/'); return {user_id:cuid, kind:key.slice(0, i), id:key.slice(i + 1), data, deleted:del}; };
async function pushNow(){
  if(!cloudReady || !sb || !cuid) return;
  if(pushing){ pushAgain = true; return; }
  const cur = toRecords(S), ups = [], dels = [];
  for(const [k, v] of cur) if(synced.get(k) !== v) ups.push(k);
  for(const k of synced.keys()) if(!cur.has(k)) dels.push(k);
  if(!ups.length && !dels.length){ setStatus('ok'); return; }
  pushing = true; setStatus('sync');
  try{
    const rows = [...ups.map(k => rowOf(k, JSON.parse(cur.get(k)), false)), ...dels.map(k => rowOf(k, {}, true))];
    for(let i = 0; i < rows.length; i += 200){
      const {error} = await sb.from('items').upsert(rows.slice(i, i + 200), {onConflict:'user_id,kind,id'});
      if(error) throw error;
    }
    ups.forEach(k => synced.set(k, cur.get(k))); dels.forEach(k => synced.delete(k)); saveMeta(); setStatus('ok');
  }catch(e){
    setStatus(navigator.onLine===false ? 'offline' : 'error', e && e.message);
    clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 15000);
  }finally{
    pushing = false; if(pushAgain){ pushAgain = false; schedulePush(); }
  }
}

/* recebimento */
async function fetchRows(since, onlyLive){
  const all = []; let from = 0;
  for(;;){
    let q = sb.from('items').select('kind,id,data,deleted,updated_at').eq('user_id', cuid)
      .order('updated_at', {ascending:true}).order('kind', {ascending:true}).order('id', {ascending:true}).range(from, from + 999);
    if(since) q = q.gt('updated_at', since);
    if(onlyLive) q = q.eq('deleted', false);
    const {data, error} = await q; if(error) throw error;
    all.push(...data); if(data.length < 1000) break; from += 1000;
  }
  return all;
}
function applyRemote(rows){
  if(!rows.length) return;
  const cur = toRecords(S), skipped = new Set();
  for(const r of rows){
    const key = r.kind + '/' + r.id;
    if(cur.get(key) !== synced.get(key)){ skipped.add(key); continue; }   // alteração local pendente vence
    applyRec(S, r.kind, r.id, r.data, r.deleted);
  }
  sortState(S);
  const cur2 = toRecords(S);
  for(const r of rows){
    const key = r.kind + '/' + r.id; if(skipped.has(key)) continue;
    if(r.deleted) synced.delete(key); else synced.set(key, cur2.get(key));
  }
  lastPull = rows.reduce((a, r) => r.updated_at > a ? r.updated_at : a, lastPull || '') || lastPull;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  saveMeta(); scheduleRender();
}
async function initialSync(){
  setStatus('sync');
  const rows = await fetchRows(null, true);
  const remote = new Map(rows.map(r => [r.kind + '/' + r.id, r.data]));
  const keep = {ui:S.ui, timer:S.timer, settings:S.settings, goals:S.goals, activities:S.activities};
  const dirtyUp = new Map(), dirtyDel = new Set();
  if(syncedOnce){
    const cur = toRecords(S);
    for(const [k, v] of cur) if(synced.get(k) !== v) dirtyUp.set(k, JSON.parse(v));
    for(const k of synced.keys()) if(!cur.has(k)) dirtyDel.add(k);
  } else if(!remote.size && legacy){
    for(const [k, v] of toRecords(legacy)) dirtyUp.set(k, JSON.parse(v));
    Object.assign(keep, {ui:legacy.ui, timer:legacy.timer, settings:legacy.settings, goals:legacy.goals, activities:legacy.activities});
  }
  const merged = new Map(remote);
  dirtyUp.forEach((v, k) => merged.set(k, v)); dirtyDel.forEach(k => merged.delete(k));
  const st = merge(defaults(), buildState(merged, keep)); sortState(st);
  replaceLocal(st);
  const cur = toRecords(S); synced = new Map();
  for(const [k, d] of remote) synced.set(k, (dirtyUp.has(k) || dirtyDel.has(k)) ? JSON.stringify(d) : (cur.has(k) ? cur.get(k) : JSON.stringify(d)));
  lastPull = rows.reduce((a, r) => r.updated_at > a ? r.updated_at : a, '') || null;
  syncedOnce = true; cloudReady = true; legacy = null;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  saveMeta(); subscribeRealtime(); boot(); schedulePush();
}
function subscribeRealtime(){
  if(chan){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
  try{
    chan = sb.channel('items-' + cuid)
      .on('postgres_changes', {event:'*', schema:'public', table:'items', filter:'user_id=eq.' + cuid}, p => {
        const r = p && p.new; if(r && r.kind) applyRemote([{kind:r.kind, id:r.id, data:r.data, deleted:r.deleted, updated_at:r.updated_at}]);
      })
      .subscribe(status => {
        if(status==='SUBSCRIBED') pullSince();
        else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT') setStatus(navigator.onLine===false ? 'offline' : 'error', 'tempo real indisponível');
      });
  }catch(e){}
}
async function pullSince(){
  if(!cloudReady || !sb) return;
  try{
    const since = lastPull ? new Date(new Date(lastPull).getTime() - 5000).toISOString() : null;
    applyRemote(await fetchRows(since, false));
    if(!pushing && !pushTimer) setStatus('ok');
  }catch(e){ setStatus(navigator.onLine===false ? 'offline' : 'error', e && e.message); }
}

function showLogin(msg){ $('#login').hidden = false; $('#lgForm').hidden = false; $('#lgBusy').hidden = true; $('#lgMsg').textContent = msg || ''; setTimeout(() => { const e = $('#lgEmail'); if(e && !e.value) e.focus(); }, 50); }
function showLoading(msg){ $('#login').hidden = false; $('#lgForm').hidden = true; $('#lgBusy').hidden = false; $('#lgBusy').textContent = msg || 'Sincronizando…'; }
const hideLogin = () => { $('#login').hidden = true; };
async function doLogin(){

  if(!email || !password){ $('#lgMsg').textContent = 'Informe e-mail e senha.'; return; }
  $('#lgBtn').disabled = true; $('#lgMsg').textContent = '';

  }catch(e){ $('#lgMsg').textContent = /invalid login/i.test((e && e.message) || '') ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + ((e && e.message) || e); }

async function startSession(user){
  cuid = user.id; cemail = user.email || '';
  if(metaUid && metaUid !== cuid){ synced = new Map(); syncedOnce = false; legacy = null; lastPull = null; try{ localStorage.removeItem(KEY); }catch(e){} replaceLocal(normalize(defaults())); }
  metaUid = cuid;

  try{ await initialSync(); hideLogin(); }
  catch(e){
    if(syncedOnce) setStatus(navigator.onLine===false ? 'offline' : 'error', e && e.message);
    else showLogin('Não foi possível sincronizar agora: ' + ((e && e.message) || e) + '. Tente entrar de novo.');
  }
}
async function cloudBoot(){
  if(!cloudWanted) return false;
  if(!window.supabase){ showLoading('Não foi possível carregar o serviço de sincronização. Verifique a conexão e recarregue a página.'); return true; }
  sb = window.supabase.createClient(CLOUD.url, CLOUD.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(ev => { if(ev==='SIGNED_OUT'){ cloudReady = false; showLogin(''); } });
  let session = null; try{ const r = await sb.auth.getSession(); session = r && r.data && r.data.session; }catch(e){}
  if(session) await startSession(session.user); else showLogin('');
  return true;
}

function hojeSets(){
  const T = today();
  const overdue = S.tasks.filter(t=>!t.done && t.due<T);
  const open = S.tasks.filter(t=>!t.done && t.due===T);
  const done = S.tasks.filter(t=>t.done && (t.due===T || (t.doneAt && dateOf(t.doneAt)===T))).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const total = overdue.length + open.length + done.length;
  return {overdue, open, done, total, pct: total ? Math.round(done.length/total*100) : 0};
}
function dayTasks(){

  if(day==='hoje'){ const h = hojeSets(); return [...h.overdue, ...h.open, ...h.done]; }

/* ============ regras de rotinas ============ */
const findRoutine = id => S.routines.find(r => r.id === id);
const logAt = (rid, d) => { const r = findRoutine(rid); return r && r.kind==='pilar' ? pillarDoneAt(r.key, d) : (S.routineLog[d] && S.routineLog[d][rid]); };
const totalDone = rid => Object.values(S.routineLog).filter(l => l[rid]).length;
const weekCount = (r, ws) => { let n=0; for(let i=0;i<7;i++) if(logAt(r.id, addDays(ws,i))) n++; return n; };
const target = r => r.mode==='weekly' ? r.goal : r.days.length;
const activeToday = r => r.kind!=='teste' && (r.mode==='weekly' || r.days.includes(dow(today())));

function streak(r){
  if(r.kind==='pilar') return pillarStreak(r);
  const T = today();
  if(r.mode==='weekly'){
    let n = 0, ws = weekStart(T);
    for(let i=0;i<300;i++){
      if(addDays(ws,6) < r.createdAt) break;
      if(weekCount(r,ws) >= r.goal) n++; else if(i>0) break;
      ws = addDays(ws,-7);
    }
    return n;
  }
  let n = 0;
  for(let i=0;i<400;i++){
    const d = addDays(T,-i);
    if(d < r.createdAt) break;
    if(!r.days.includes(dow(d))) continue;
    if(logAt(r.id,d)) n++; else if(i===0) continue; else break;
  }
  return n;
}
const streakText = (r, n) => r.kind==='pilar' ? (r.key==='fisica' ? `${n} semana${n>1?'s':''} seguida${n>1?'s':''} na meta` : r.key==='alimentacao' ? (n>1 ? `${n} dias saudáveis seguidos` : `${n} dia saudável`) : `sequência de ${n} dia${n>1?'s':''}`) : r.mode==='weekly' ? `${n} semana${n>1?'s':''} seguida${n>1?'s':''} na meta` : `sequência de ${n} dia${n>1?'s':''}`;

function counts(){

    hoje, amanha: open.filter(t=>t.due===T1).length, depois: open.filter(t=>t.due>T1).length,
    atividades: hoje,
    rotina: S.routines.filter(r=>activeToday(r) && !logAt(r.id,T)).length,
    ideias: S.ideas.length
  };
}

function routineCard(r){
  if(r.kind==='pilar') return pillarCard(r);
  const T = today(), D = rdate(), at = logAt(r.id,D), done = !!at;
  const ilog = (S.routineItemLog[D] && S.routineItemLog[D][r.id]) || {};
  const note = (S.routineNote[D] && S.routineNote[D][r.id]) || '';
  const checkBtn = `<button class="check" data-act="r-toggle" aria-pressed="${done}" aria-label="${done?'Desmarcar rotina':'Marcar como feita'}">${ic('check',16,3.2)}</button>`;

  if(r.kind==='teste'){
    const n = totalDone(r.id);
    return `<article class="task routine ${done?'is-done':''}" data-id="${r.id}">${checkBtn}
      <div class="task-main"><button class="task-title" data-act="r-edit">${esc(r.title)}</button>
        <div class="meta">${done?doneTxt(at,D):''}<span>${n?`feita ${n} vez${n>1?'es':''}`:'ainda não feita'}</span>
        <button class="mini" data-act="r-convert">Tornar rotina</button></div></div></article>`;
  }

  const ws = weekStart(D), cnt = weekCount(r,ws), tgt = target(r), sk = streak(r);
  const pct = tgt ? Math.min(100, Math.round(cnt/tgt*100)) : 0;
  const cells = [0,1,2,3,4,5,6].map(i=>{
    const d = addDays(ws,i), w = dow(d), sch = r.mode==='weekly' || r.days.includes(w);
    let cls;
    if(d < r.createdAt) cls='off';
    else if(logAt(r.id,d)) cls='ok';
    else if(!sch) cls='off';
    else if(d===T) cls='now';
    else if(d>T) cls='future';
    else cls = r.mode==='days' ? 'miss' : 'idle';
    return `<button class="wd ${cls} ${d===D?'sel':''}" data-act="r-goto" data-d="${d}" ${d>T?'disabled':''} title="${shortDate(d)}" aria-label="${shortDate(d)}">${WD[w].charAt(0).toUpperCase()}</button>`;
  }).join('');
  const ph = r.kind==='pilar' ? PILARES[r.key].ph : 'Anotação de hoje';
  const daysTxt = r.mode==='days' && r.days.length<7 ? (r.days.length ? r.days.map(d=>WD[d]).join(', ') : 'sem dias') : '';
  const items = r.items || [];
  return `<article class="task routine ${done?'is-done':''}" data-id="${r.id}">${checkBtn}
    <div class="task-main">
      <div class="rhead">${r.kind==='pilar'?`<span class="pico">${ic(PILARES[r.key].icon,16)}</span>`:''}<button class="task-title" data-act="r-edit">${esc(r.title)}</button></div>
      <div class="meta">
        ${done?doneTxt(at,D):''}
        ${r.mode==='weekly'?`<span>${cnt} de ${r.goal} nesta semana</span>`:''}
        ${daysTxt?`<span>${daysTxt}</span>`:''}
        ${sk>0?`<span>${streakText(r,sk)}</span>`:''}
      </div>
      ${r.mode==='weekly'?`<div class="progress sm"><span style="width:${pct}%"></span></div>`:''}
      ${items.length?`<ul class="subs">${items.map(it=>`<li class="${ilog[it.id]?'is-done':''}"><button class="check sm" data-act="r-item" data-iid="${it.id}" aria-pressed="${!!ilog[it.id]}" aria-label="Alternar etapa">${ic('check',12,3.4)}</button><span>${esc(it.title)}</span>${timeIfSame(ilog[it.id], D)?`<time>${timeIfSame(ilog[it.id], D)}</time>`:''}</li>`).join('')}</ul>`:''}
      <input class="note" data-note="1" value="${esc(note)}" placeholder="${esc(ph)}" aria-label="Anotação de hoje" autocomplete="off">
      <div class="week" aria-label="Semana">${cells}</div>
    </div></article>`;
}

function viewRotina(){
  const T = today(), D = rdate();
  const list = S.routines.filter(r=>activeOn(r,D));
  const doneN = list.filter(r=>logAt(r.id,D)).length;
  const pct = list.length ? Math.round(doneN/list.length*100) : 0;
  const pilares = S.routines.filter(r=>r.kind==='pilar');
  const outras = S.routines.filter(r=>r.kind==='rotina').sort((a,b)=>activeOn(b,D)-activeOn(a,D));
  const testes = S.routines.filter(r=>r.kind==='teste');
  const dn = `<div class="datenav"><button class="ghost" data-act="r-prev" aria-label="Dia anterior">${ic('chevL',18,2.6)}</button><input type="date" id="rdateInput" value="${D}" max="${T}" aria-label="Dia dos registros"><button class="ghost" data-act="r-next" ${D>=T?'disabled':''} aria-label="Próximo dia">${ic('chevR',18,2.6)}</button>${D!==T?`<button class="lnk" data-act="r-today">Voltar para hoje</button>`:''}</div>`;
  let h = `<div class="narrow rot"><div class="rot-top"><div class="pagehead"><h1>Rotina</h1>${dn}</div>`;
  h += `<div class="daybar"><span class="daydate">${cap(fullDate(D))}</span>${D!==T?`<span class="pastchip">${relDay(D)}</span>`:''}<div class="progress inl" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><span class="daycount">${doneN} de ${list.length} feitas ${D===T?'hoje':'no dia'}</span></div>`;
  if(D!==T) h += `<p class="sec-note" style="margin:6px 0 0">Você está lançando registros do dia ${dmShort(D)}. Os horários desses lançamentos não são exibidos.</p>`;
  h += `</div>`;
  h += `<div class="sumwrap">${summaryHTML()}</div>`;
  h += `<div class="rot-pil">${section('Pilares', pilares.map(pillarCard).join(''))}</div>`;
  h += `<div class="rot-rest"><h2 class="sec">Outras rotinas</h2>`;
  h += outras.length ? `<div class="list">${outras.map(routineCard).join('')}</div>` : `<p class="sec-note">Nenhuma ainda. Crie uma com dias fixos ou meta semanal.</p>`;
  h += `<div class="toolbar"><button class="btn" data-act="r-new">${ic('plus',16,2.6)} Nova rotina</button></div>`;
  h += `<h2 class="sec" style="margin-top:22px">Em teste</h2><p class="sec-note">Atividades avulsas para experimentar. Se virarem hábito, toque em Tornar rotina.</p>`;
  h += `<div class="capture" style="margin-bottom:8px"><input id="testInput" placeholder="Nova atividade para testar e Enter" autocomplete="off" aria-label="Nova atividade em teste"><button class="btn" data-act="test-add">Adicionar</button></div>`;
  h += testes.length ? `<div class="list">${testes.map(routineCard).join('')}</div>` : '';
  return h + `</div></div>`;
}

function toggleRoutine(id){
  const T = rdate(), l = (S.routineLog[T] = S.routineLog[T] || {});
  if(l[id]) delete l[id];
  else {
    l[id] = new Date().toISOString(); touchCreated(r=>r.id===id, T);
    toast(T===today() ? `Feita às ${hhmm(l[id])}` : `Marcada em ${dmShort(T)}`, ()=>{ delete S.routineLog[T][id]; persist(); render(); });
  }
  persist(); render();
}
function toggleRItem(id, iid){
  const T = rdate(), r = findRoutine(id); if(!r) return;
  const il = (S.routineItemLog[T] = S.routineItemLog[T] || {}), m = (il[id] = il[id] || {});
  const l = (S.routineLog[T] = S.routineLog[T] || {}), now = new Date().toISOString();
  if(m[iid]){ delete m[iid]; delete l[id]; }
  else {
    m[iid] = now;
    if(r.items.every(x=>m[x.id]) && !l[id]){ l[id] = now; touchCreated(x=>x.id===id, T); toast(T===today() ? `Feita às ${hhmm(now)}` : `Marcada em ${dmShort(T)}`); }
  }
  persist(); render();
}
function addTest(){
  const inp = $('#testInput'); if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  S.routines.push({id:uid(), kind:'teste', title:v, mode:'days', goal:3, days:[], items:[], createdAt:today()});
  persist(); render(); const n = $('#testInput'); if(n) n.focus();
}

/* ============ pilares: atividade física, leitura e alimentação ============ */
/* dia em que os registros da Rotina são lançados (nulo = hoje) */
let rsel = null;
const rdate = () => rsel || today();
const setRday = d => { rsel = (!d || d >= today()) ? null : d; render(); };
const dayWord = () => rdate()===today() ? 'hoje' : 'no dia';
const timeIfSame = (iso, d) => (iso && dateOf(iso)===d) ? hhmm(iso) : '';
const dmShort = s => { const [y,m,d] = parts(s); return `${pad(d)}/${pad(m)}`; };
const relDay = s => { const n = diff(s, today()); return n===1 ? 'ontem' : n===2 ? 'anteontem' : `há ${n} dias`; };
const stampFor = d => d===today() ? new Date().toISOString() : new Date(`${d}T12:00:00`).toISOString();
const activeOn = (r, d) => r.kind!=='teste' && (r.mode==='weekly' || r.days.includes(dow(d)));
const doneTxt = (at, d) => { const t = timeIfSame(at, d); return `<span class="done-at">${t ? `feita às ${t}` : 'feita'}</span>`; };
function touchCreated(match, d){ const r = S.routines.find(match); if(r && d < r.createdAt) r.createdAt = d; }
const MEALS = [{k:'cafe',n:'Café da manhã'}, {k:'almoco',n:'Almoço'}, {k:'tarde',n:'Café da tarde'}, {k:'jantar',n:'Jantar'}];
const fmtMin = m => m>=60 ? `${Math.floor(m/60)}h${pad(m%60)}` : `${m} min`;
const plural = (n, s, p) => `${n} ${n===1?s:p}`;
const dayFit = d => S.fitLog.filter(e=>e.date===d);
const fitMin = d => dayFit(d).reduce((a,e)=>a+e.min,0);
const dayPages = d => S.readLog.filter(e=>e.date===d).reduce((a,e)=>a+e.pages,0);
const dayMeals = d => S.mealLog[d] || {};
const healthyCount = d => MEALS.filter(m=>dayMeals(d)[m.k] && dayMeals(d)[m.k].v==='s').length;
const loggedCount = d => MEALS.filter(m=>dayMeals(d)[m.k]).length;
const weekMin = ws => { let n=0; for(let i=0;i<7;i++) n += fitMin(addDays(ws,i)); return n; };
const weekPages = ws => { let n=0; for(let i=0;i<7;i++) n += dayPages(addDays(ws,i)); return n; };
const bookRead = b => (b.offset||0) + S.readLog.filter(e=>e.bookId===b.id).reduce((a,e)=>a+e.pages,0);
const currentBook = () => S.books.find(b=>b.status==='lendo');
const selectedActivity = () => S.activities.includes(S.ui.fitAct) ? S.ui.fitAct : (S.activities[0] || null);

/* horário em que o pilar foi cumprido no dia (ou nulo) */
function pillarDoneAt(key, d){
  if(key==='fisica'){ const e = dayFit(d).sort((a,b)=>a.at.localeCompare(b.at)); return e[0] ? e[0].at : null; }
  if(key==='leitura'){
    const e = S.readLog.filter(x=>x.date===d).sort((a,b)=>a.at.localeCompare(b.at)); let c = 0;
    for(const x of e){ c += x.pages; if(c >= S.goals.leituraPag) return x.at; }
    return null;
  }
  if(key==='alimentacao'){
    const m = dayMeals(d); if(loggedCount(d) < MEALS.length) return null;
    return MEALS.map(x=>m[x.k].at).sort().pop();
  }
  return null;
}
function pillarDayState(key, d){
  if(key==='fisica') return fitMin(d) > 0 ? 'ok' : '';
  if(key==='leitura'){ const p = dayPages(d); return p >= S.goals.leituraPag ? 'ok' : p > 0 ? 'part' : ''; }
  const h = healthyCount(d); return h >= S.goals.alimSaud ? 'ok' : loggedCount(d) > 0 ? 'part' : '';
}
function pillarStreak(r){
  const T = today();
  if(r.key==='fisica'){
    let n = 0, ws = weekStart(T);
    for(let i=0;i<300;i++){
      if(addDays(ws,6) < r.createdAt) break;
      if(weekMin(ws) >= S.goals.fisicaMin) n++; else if(i>0) break;
      ws = addDays(ws,-7);
    }
    return n;
  }
  let n = 0;
  for(let i=0;i<400;i++){
    const d = addDays(T,-i);
    if(d < r.createdAt) break;
    if(pillarDayState(r.key,d)==='ok') n++; else if(i===0) continue; else break;
  }
  return n;
}
function pillarCells(r){
  const T = today(), D = rdate(), ws = weekStart(D);
  return [0,1,2,3,4,5,6].map(i=>{
    const d = addDays(ws,i), w = dow(d);
    let cls, tip = shortDate(d);
    if(d < r.createdAt) cls = 'off';
    else if(d > T) cls = 'future';
    else {
      const st = pillarDayState(r.key,d);
      cls = st==='ok' ? 'ok' : st==='part' ? 'warn' : d===T ? 'now' : (r.key==='fisica' ? 'idle' : 'miss');
      if(r.key==='fisica') tip += `: ${fmtMin(fitMin(d))}`;
      else if(r.key==='leitura') tip += `: ${dayPages(d)} págs`;
      else tip += `: ${healthyCount(d)} saudáveis de ${loggedCount(d)}`;
    }
    return `<button class="wd ${cls} ${d===D?'sel':''}" data-act="r-goto" data-d="${d}" ${d>T?'disabled':''} title="${tip}" aria-label="${tip}">${WD[w].charAt(0).toUpperCase()}</button>`;
  }).join('');
}
const pillarStatus = (r, d) => { const on = !!logAt(r.id, d); return `<span class="check st" role="img" aria-pressed="${on}" aria-label="${on?'Feita neste dia':'Ainda não feita neste dia'}">${ic('check',16,3.2)}</span>`; };
const pillarMeta = (r, first) => { const sk = pillarStreak(r); return `<div class="meta">${first}${sk>0?`<span>${streakText(r,sk)}</span>`:''}</div>`; };

function pillarCard(r){
  return r.key==='fisica' ? fitCard(r) : r.key==='leitura' ? readCard(r) : foodCard(r);
}

/* ---- atividade física ---- */
let addingAct = false, actDraft = '';
function fitCard(r){
  const D = rdate(), ws = weekStart(D), goal = S.goals.fisicaMin, sel = selectedActivity();
  const wm = weekMin(ws), tm = fitMin(D), pct = Math.min(100, Math.round(wm/goal*100));
  const groups = {}; dayFit(D).forEach(e=>{ groups[e.activity] = (groups[e.activity]||0) + e.min; });
  const done = !!logAt(r.id,D);
  return `<article class="task pillar ${done?'is-done':''}" data-id="${r.id}">${pillarStatus(r,D)}
    <div class="task-main">
      <div class="rhead"><span class="pico">${ic('pulse',16)}</span><button class="task-title" data-act="r-edit">${esc(r.title)}</button><span class="grow"></span><span class="pnum"><b>${fmtMin(tm)}</b> ${dayWord()}</span></div>
      ${pillarMeta(r, `<span>semana: ${fmtMin(wm)} de ${fmtMin(goal)}</span>`)}
      <div class="progress sm"><span style="width:${pct}%"></span></div>
      <div class="achips" role="group" aria-label="Atividade">
        ${S.activities.map(a=>`<button class="achip ${a===sel?'on':''}" data-act="fit-act" data-name="${esc(a)}" aria-pressed="${a===sel}">${esc(a)}</button>`).join('')}
        ${addingAct ? `<input id="actNew" class="actnew" placeholder="Nova atividade" value="${esc(actDraft)}" autocomplete="off" aria-label="Nome da nova atividade"><button class="achip" data-act="fit-new-save">Adicionar</button>`
                    : `<button class="achip dash" data-act="fit-new-open">${ic('plus',12,3)} Nova</button>`}
      </div>
      <div class="adds"><span class="adds-l">${sel?`Somar em ${esc(sel)}:`:'Cadastre uma atividade para começar'}</span>
        ${[5,10,30].map(n=>`<button class="btn add" data-act="fit-add" data-min="${n}" ${sel?'':'disabled'}>+${n} min</button>`).join('')}</div>
      ${Object.keys(groups).length ? `<div class="tlog">${Object.entries(groups).map(([a,m])=>`<span class="lchip">${esc(a)} <b>${fmtMin(m)}</b><button class="lx" data-act="fit-del" data-name="${esc(a)}" aria-label="Remover ${esc(a)} de hoje">${ic('x',11,3)}</button></span>`).join('')}</div>` : ''}
      <div class="week" aria-label="Semana">${pillarCells(r)}</div>
    </div></article>`;
}
function addFit(min){
  const act = selectedActivity(); if(!act) return;
  const D = rdate(), e = {id:uid(), at:new Date().toISOString(), date:D, activity:act, min};
  S.fitLog.push(e); touchCreated(r=>r.kind==='pilar' && r.key==='fisica', D); persist(); render();
  toast(`+${min} min de ${act}${D!==today()?` em ${dmShort(D)}`:''}`, ()=>{ S.fitLog = S.fitLog.filter(x=>x.id!==e.id); persist(); render(); });
}
function addActivity(){
  const v = actDraft.trim(); if(!v) return;
  const found = S.activities.find(a=>a.toLowerCase()===v.toLowerCase());
  if(!found) S.activities.push(v);
  S.ui.fitAct = found || v; addingAct = false; actDraft = '';
  persist(); render();
}

/* ---- leitura ---- */
let lidosOpen = false, bdraft = null;
let addingBook = false, bookDraft = {title:'', total:'', offset:''};
function readCard(r){
  const D = rdate(), ws = weekStart(D), goal = S.goals.leituraPag, pt = dayPages(D), wp = weekPages(ws);
  const cur = currentBook(), queue = S.books.filter(b=>b.status==='aler'), lidos = S.books.filter(b=>b.status==='lido');
  const done = !!logAt(r.id,D), pct = Math.min(100, Math.round(pt/goal*100));
  let bookHTML;
  if(cur){
    const read = bookRead(cur), bp = cur.total ? Math.min(100, Math.round(read/cur.total*100)) : 0;
    bookHTML = `<div class="book" data-bid="${cur.id}">
      <div class="brow"><b>${esc(cur.title)}</b><small>${read}${cur.total?` de ${cur.total}`:''} págs${cur.total?` (${bp}%)`:''}</small><button class="ghost sm" data-act="book-edit" aria-label="Editar livro" title="Editar livro">${ic('edit',15)}</button></div>
      ${cur.total?`<div class="progress sm"><span style="width:${bp}%"></span></div>`:''}
      <div class="adds"><span class="adds-l">Somar páginas lidas:</span>
        <button class="btn add" data-act="pages-add" data-n="5">+5 págs</button>
        <button class="btn add" data-act="pages-add" data-n="10">+10 págs</button>
        <button class="lnk" data-act="book-finish">Concluir livro</button></div></div>`;
  } else {
    bookHTML = `<p class="nobook">${S.books.some(b=>b.status==='aler')?'Nenhum livro em leitura. Toque em Começar em um livro da fila.':'Nenhum livro em leitura. Cadastre um livro para começar.'}</p>`;
  }
  const form = addingBook
    ? `<div class="bform"><input data-bd="title" placeholder="Título do livro" value="${esc(bookDraft.title)}" autocomplete="off" aria-label="Título do livro">
        <div class="bform-r"><input data-bd="total" type="number" min="1" inputmode="numeric" placeholder="Total de páginas (opcional)" value="${esc(bookDraft.total)}" aria-label="Total de páginas">
        <input data-bd="offset" type="number" min="0" inputmode="numeric" placeholder="Página em que estou (opcional)" value="${esc(bookDraft.offset)}" aria-label="Página atual"></div>
        <div class="bform-a"><button class="btn primary" data-act="book-save">Adicionar livro</button><button class="btn" data-act="book-cancel">Cancelar</button></div></div>`
    : `<div class="adds"><button class="btn" data-act="book-add-open">${ic('plus',16,2.6)} Cadastrar livro</button></div>`;
  return `<article class="task pillar ${done?'is-done':''}" data-id="${r.id}">${pillarStatus(r,D)}
    <div class="task-main">
      <div class="rhead"><span class="pico">${ic('book',16)}</span><button class="task-title" data-act="r-edit">${esc(r.title)}</button><span class="grow"></span><span class="pnum"><b>${pt}</b>/${goal} págs</span></div>
      ${pillarMeta(r, `<span>semana: ${plural(wp,'página','páginas')}</span>`)}
      <div class="progress sm"><span style="width:${pct}%"></span></div>
      ${bookHTML}
      ${queue.length?`<p class="qhead">Na fila (${queue.length})</p>${queue.map(b=>`<div class="qrow" data-bid="${b.id}"><span class="qt">${esc(b.title)}${b.total?` <small>${b.total} págs</small>`:''}</span><button class="mini" data-act="book-start">Começar</button><button class="ghost sm" data-act="book-edit" aria-label="Editar livro" title="Editar livro">${ic('edit',14)}</button><button class="ghost sm" data-act="book-del" aria-label="Remover da fila">${ic('x',14)}</button></div>`).join('')}`:''}
      ${lidos.length?`<details class="lidos" ${lidosOpen?'open':''}><summary>Lidos (${lidos.length})</summary>${lidos.map(b=>`<div class="qrow" data-bid="${b.id}"><span class="qt">${esc(b.title)}</span><small>${b.finishedAt?shortDate(dateOf(b.finishedAt)):''}</small><button class="ghost sm" data-act="book-edit" aria-label="Editar livro" title="Editar livro">${ic('edit',14)}</button></div>`).join('')}</details>`:''}
      <div style="margin-top:10px">${form}</div>
      <div class="week" aria-label="Semana">${pillarCells(r)}</div>
    </div></article>`;
}
function addPages(n){
  const b = currentBook(); if(!b) return;
  const D = rdate(), e = {id:uid(), at:new Date().toISOString(), date:D, bookId:b.id, pages:n};
  S.readLog.push(e); touchCreated(r=>r.kind==='pilar' && r.key==='leitura', D);
  let finished = false;
  if(b.total && bookRead(b) >= b.total){ b.status = 'lido'; b.finishedAt = stampFor(D); finished = true; }
  persist(); render();
  toast(finished ? `Livro concluído: ${b.title}` : `+${n} páginas em ${b.title}${D!==today()?` (${dmShort(D)})`:''}`, ()=>{ S.readLog = S.readLog.filter(x=>x.id!==e.id); if(finished){ b.status='lendo'; b.finishedAt=null; } persist(); render(); });
}
function saveBook(){
  const title = bookDraft.title.trim(); if(!title) return;
  const total = parseInt(bookDraft.total,10) || null, offset = Math.max(0, parseInt(bookDraft.offset,10) || 0);
  S.books.push({id:uid(), title, total, offset, status: currentBook() ? 'aler' : 'lendo', addedAt:new Date().toISOString(), finishedAt:null});
  addingBook = false; bookDraft = {title:'', total:'', offset:''};
  persist(); render();
}
function startBook(id){
  S.books.forEach(b=>{ if(b.status==='lendo') b.status = 'aler'; });
  const b = S.books.find(x=>x.id===id); if(b){ b.status = 'lendo'; b.finishedAt = null; }
  persist(); render();
}
function finishBook(id){
  const b = S.books.find(x=>x.id===id); if(!b) return;
  b.status = 'lido'; b.finishedAt = new Date().toISOString(); persist(); render();
  toast(`Livro concluído: ${b.title}`, ()=>{ b.status='lendo'; b.finishedAt=null; persist(); render(); });
}
function delBook(id){
  const b = S.books.find(x=>x.id===id); if(!b) return;
  const logs = S.readLog.filter(x=>x.bookId===id);
  S.books = S.books.filter(x=>x.id!==id); S.readLog = S.readLog.filter(x=>x.bookId!==id); persist(); render();
  toast(`Removido: ${b.title}`, ()=>{ S.books.push(b); S.readLog.push(...logs); persist(); render(); });
}

/* ---- alimentação ---- */
function foodCard(r){
  const D = rdate(), ws = weekStart(D), m = dayMeals(D), h = healthyCount(D), lg = loggedCount(D);
  let hw = 0, lw = 0; for(let i=0;i<7;i++){ const d = addDays(ws,i); hw += healthyCount(d); lw += loggedCount(d); }
  const pct = lw ? Math.round(hw/lw*100) : 0, done = !!logAt(r.id,D);
  return `<article class="task pillar ${done?'is-done':''}" data-id="${r.id}">${pillarStatus(r,D)}
    <div class="task-main">
      <div class="rhead"><span class="pico">${ic('leaf',16)}</span><button class="task-title" data-act="r-edit">${esc(r.title)}</button><span class="grow"></span><span class="pnum"><b>${h}</b>/${MEALS.length} saudáveis</span></div>
      ${pillarMeta(r, `<span>semana: ${hw} de ${lw} refeições saudáveis${lw?` (${pct}%)`:''}</span>`)}
      <div class="progress sm"><span style="width:${pct}%"></span></div>
      <div class="meals">${MEALS.map(x=>{ const v = m[x.k] && m[x.k].v;

/* ---- resumo (totalizadores) ---- */
let rperiod = 'week';
function summaryHTML(){
  const T = today(), D = rdate(), ws = weekStart(D);
  const days = rperiod==='week' ? [0,1,2,3,4,5,6].map(i=>addDays(ws,i)) : Array.from({length:30},(_,i)=>addDays(D,i-29));
  const past = days.filter(d=>d<=T), set = new Set(days), wk = rperiod==='week';
  // física
  const fTot = past.reduce((a,d)=>a+fitMin(d),0), fAct = past.filter(d=>fitMin(d)>0).length;
  const byAct = {}; S.fitLog.filter(e=>set.has(e.date)).forEach(e=>{ byAct[e.activity] = (byAct[e.activity]||0) + e.min; });
  const top = Object.entries(byAct).sort((a,b)=>b[1]-a[1])[0];
  const fPct = Math.min(100, Math.round(fTot/S.goals.fisicaMin*100));
  // leitura
  const lTot = past.reduce((a,d)=>a+dayPages(d),0), lAct = past.filter(d=>dayPages(d)>0).length;
  const lGoal = S.goals.leituraPag*7, lPct = Math.min(100, Math.round(lTot/lGoal*100));
  const booksDone = S.books.filter(b=>b.status==='lido' && b.finishedAt && set.has(dateOf(b.finishedAt))).length;
  // alimentação
  const aH = past.reduce((a,d)=>a+healthyCount(d),0), aL = past.reduce((a,d)=>a+loggedCount(d),0);
  const aPct = aL ? Math.round(aH/aL*100) : 0, aDays = past.filter(d=>healthyCount(d)>=S.goals.alimSaud).length;
  const tile = (icon, name, val, small, pct, lines, chart) => `<div class="tile"><div class="tile-h"><span class="pico">${ic(icon,16)}</span>${name}</div>
    <div class="tile-v">${val}<small>${small}</small></div>${pct!==null?`<div class="progress sm" style="margin-top:0"><span style="width:${pct}%"></span></div>`:''}
    <p class="tile-s">${lines.join('<br>')}</p>${chart}</div>`;
  const sumTitle = wk ? (ws===weekStart(T) ? 'Progresso da semana' : `Progresso da semana de ${dmShort(ws)}`) : (D===T ? 'Progresso dos últimos 30 dias' : `Progresso dos 30 dias até ${dmShort(D)}`);
  return `<div class="sumhead"><h2>${sumTitle}</h2>
      <div class="psw" role="group" aria-label="Período"><button data-act="r-period" data-p="week" aria-pressed="${wk}">Semana</button><button data-act="r-period" data-p="month" aria-pressed="${!wk}">30 dias</button></div></div>
    <div class="tiles">
      ${tile('pulse','Atividade física', fmtMin(fTot), wk?` de ${fmtMin(S.goals.fisicaMin)}`:' no período', wk?fPct:null,
        [plural(fAct,'dia ativo','dias ativos'), top?`mais praticada: ${esc(top[0])}`:'nenhuma atividade ainda'], chartHTML(days.map(d=>({d,n:fitMin(d)})),'Minutos por dia',{mark:D}))}
      ${tile('book','Leitura', String(lTot), wk?` de ${lGoal} págs`:' págs no período', wk?lPct:null,
        [plural(lAct,'dia de leitura','dias de leitura'), plural(booksDone,'livro concluído','livros concluídos')], chartHTML(days.map(d=>({d,n:dayPages(d)})),'Páginas por dia',{mark:D}))}
      ${tile('leaf','Alimentação', `${aPct}%`, ' saudáveis', aL?aPct:null,
        [`${aH} de ${aL} refeições`, plural(aDays,'dia saudável','dias saudáveis')], chartHTML(days.map(d=>({d,n:healthyCount(d)})),'Refeições saudáveis por dia',{max:4, mark:D}))}
    </div>`;
}

let zenOpen = false, zenFs = false, wakeLock = null;
async function openZen(){

  try{ if(document.documentElement.requestFullscreen && !document.fullscreenElement){ await document.documentElement.requestFullscreen(); zenFs = true; } }catch(e){ zenFs = false; }

function updateZen(){
  if(!zenOpen) return;
  const t = S.timer, rem = timerRemaining(), tot = modeMs(t.mode), secs = Math.ceil(rem/1000), started = t.running || t.remaining < tot;
  const ft = t.taskId ? findTask(t.taskId) : null, T = today();

  set('zGo', t.running ? 'Pausar' : started ? 'Continuar' : 'Iniciar'); set('zTask', ft ? ft.title : 'Sem tarefa vinculada');
  set('zFoot', `${plural(log.length,'pomodoro','pomodoros')} hoje, ${mins} min focados`);

/* ---- janela flutuante (Picture-in-Picture de documento: Chrome e Edge no computador) ---- */
let pipWin = null, favLink = null, favOrig = '', favKey = '';
const pipSupported = () => 'documentPictureInPicture' in window;
function buildPip(w){
  const d = w.document, cs = getComputedStyle(document.documentElement), root = d.documentElement;
  ['--bg','--surface','--ink','--ink-2','--line','--soft','--brand','--brand-ink','--signal','--signal-ink','--signal-strong','--display','--body']
    .forEach(v => root.style.setProperty(v, cs.getPropertyValue(v)));
  d.title = 'Foco';
  const st = d.createElement('style');
  st.textContent = `*{box-sizing:border-box}html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body),system-ui,sans-serif;display:grid;place-items:center;padding:10px;transition:background .3s}
    body.flash{animation:fl 1s ease-in-out 6}@keyframes fl{50%{background:var(--signal)}}
    @media (prefers-reduced-motion:reduce){body.flash{animation:none;background:var(--signal)}}
    .p{width:100%;display:grid;gap:7px;text-align:center}
    .m{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:var(--ink-2)}
    .m b{color:var(--ink)}.m span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .t{font:700 48px/1 var(--display),system-ui,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
    .bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
    .bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .5s linear}
    .brk .bar i{background:var(--signal-strong)}
    .btns{display:flex;gap:6px}
    button{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;min-height:34px;padding:0 12px;cursor:pointer}
    button.go{flex:1;background:var(--brand);color:var(--brand-ink);border-color:transparent}
    button:focus-visible{outline:3px solid var(--signal-strong);outline-offset:2px}`;
  d.head.appendChild(st);
  d.body.innerHTML = `<div class="p" id="pRoot"><div class="m"><b id="pMode">Foco</b><span id="pTask"></span></div>
    <div class="t" id="pTime" role="timer">25:00</div><div class="bar"><i id="pBar"></i></div>
    <div class="btns"><button class="go" id="pGo">Iniciar</button><button id="pReset" title="Reiniciar" aria-label="Reiniciar">Reiniciar</button><button id="pSkip" title="Pular" aria-label="Pular">Pular</button></div></div>`;
  d.getElementById('pGo').onclick = () => { S.timer.running ? pauseTimer() : startTimer(); };
  d.getElementById('pReset').onclick = () => resetTimer();
  d.getElementById('pSkip').onclick = () => skipTimer();
}
function updatePip(){
  if(!pipWin) return;
  try{
    const d = pipWin.document, t = S.timer, rem = timerRemaining(), tot = modeMs(t.mode), secs = Math.ceil(rem/1000);
    const started = t.running || t.remaining < tot, ft = t.taskId ? findTask(t.taskId) : null;
    const set = (id, v) => { const e = d.getElementById(id); if(e && e.textContent !== v) e.textContent = v; };
    set('pTime', `${pad(Math.floor(secs/60))}:${pad(secs%60)}`); set('pMode', MODE_NAME[t.mode]);
    set('pTask', ft ? ft.title : 'Sem tarefa vinculada'); set('pGo', t.running ? 'Pausar' : started ? 'Continuar' : 'Iniciar');
    const bar = d.getElementById('pBar'); if(bar) bar.style.width = Math.max(0, Math.min(100, (1 - rem/tot) * 100)) + '%';
    const root = d.getElementById('pRoot'); if(root) root.classList.toggle('brk', t.mode !== 'focus');
    d.title = t.running ? `${pad(Math.floor(secs/60))}:${pad(secs%60)} ${MODE_NAME[t.mode]}` : 'Foco';
  }catch(e){}
}
function pipFlash(){ if(!pipWin) return; try{ pipWin.document.body.classList.remove('flash'); void pipWin.document.body.offsetWidth; pipWin.document.body.classList.add('flash'); setTimeout(()=>{ try{ pipWin && pipWin.document.body.classList.remove('flash'); }catch(e){} }, 7000); }catch(e){} }
async function openPip(){
  if(!pipSupported() || pipWin) return;
  try{
    const w = await window.documentPictureInPicture.requestWindow({width:300, height:172});
    pipWin = w; buildPip(w);
    w.addEventListener('pagehide', () => { pipWin = null; renderDock(); updateTimerUI(); });
    renderDock(); updateTimerUI();
  }catch(e){ toast('Não foi possível abrir a janela flutuante. Toque no botão de novo.'); }
}
function togglePip(){ if(pipWin){ try{ pipWin.close(); }catch(e){} pipWin = null; renderDock(); updateTimerUI(); } else openPip(); }

/* ícone da aba com os minutos restantes (funciona em qualquer navegador) */
function updateFavicon(rem){
  if(!favLink){
    favLink = document.querySelector('link[rel~="icon"]');
    if(!favLink){ favLink = document.createElement('link'); favLink.rel = 'icon'; document.head.appendChild(favLink); }
    favOrig = favLink.getAttribute('href') || '';
  }
  const key = S.timer.running ? S.timer.mode + Math.ceil(rem/60000) : '';
  if(key === favKey) return; favKey = key;
  if(!key){ if(favOrig) favLink.setAttribute('href', favOrig); else favLink.removeAttribute('href'); return; }
  try{
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); if(!g) return;
    g.fillStyle = S.timer.mode==='focus' ? '#0E6B4A' : '#B58900'; g.beginPath();
    if(g.roundRect) g.roundRect(0, 0, 64, 64, 14); else g.rect(0, 0, 64, 64); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 40px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(Math.ceil(rem/60000)), 32, 36);
    favLink.type = 'image/png'; favLink.setAttribute('href', c.toDataURL('image/png'));
  }catch(e){}
}

function askNotify(){ try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){} }
function notifyUser(title, body){ try{ if('Notification' in window && Notification.permission==='granted') new Notification(title,{body}); }catch(e){} }
function beep(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach((t,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value = i===2?880:660; g.gain.value=.15; o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.18); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function startTimer(){ const t=S.timer; if(t.running) return; if(t.remaining<=0) t.remaining=modeMs(t.mode); t.endsAt=Date.now()+t.remaining; t.running=true; persist(); askNotify(); if(S.ui.pipAuto && pipSupported() && !pipWin) openPip(); render(); }
function pauseTimer(){ const t=S.timer; if(!t.running) return; t.remaining=Math.max(0,t.endsAt-Date.now()); t.running=false; t.endsAt=null; persist(); render(); }
function resetTimer(){ const t=S.timer; t.running=false; t.endsAt=null; t.remaining=modeMs(t.mode); persist(); render(); }
function setMode(m){ const t=S.timer; t.mode=m; t.running=false; t.endsAt=null; t.remaining=modeMs(m); persist(); render(); }
function skipTimer(){ setMode(S.timer.mode==='focus' ? 'short' : 'focus'); }
function finishTimer(notify){
  const t = S.timer, was = t.mode;
  if(was==='focus'){
    S.pomoLog.push({id:uid(), taskId:t.taskId||null, at:new Date().toISOString(), min:S.settings.focus});
    t.cycle = (t.cycle||0)+1;
    t.mode = t.cycle % S.settings.every === 0 ? 'long' : 'short';
  } else t.mode = 'focus';
  t.running=false; t.endsAt=null; t.remaining=modeMs(t.mode);
  persist();
  if(notify){ beep(); pipFlash(); zenFlash(); notifyUser(was==='focus'?'Pomodoro concluído':'Pausa encerrada', was==='focus'?'Hora de uma pausa.':'Hora de voltar ao foco.'); }
  render();
}
setInterval(()=>{ if(S.timer.running && timerRemaining()<=0) finishTimer(true); else updateTimerUI(); }, 500);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ if(S.timer.running && timerRemaining()<=0) finishTimer(false); else render(); if(cloudReady) pullSince(); } });

function setFocusTask(id, fromDrag){

    t.done=true; t.doneAt=new Date().toISOString();
    if(S.timer.taskId===id && !S.timer.running) S.timer.taskId = null;
    toast(`Concluída às ${hhmm(t.doneAt)}`, ()=>{ t.done=false; t.doneAt=null; persist(); render(); });
  }
  persist(); render();
}
function toggleSub(id, sid){
  const t = findTask(id); if(!t) return;
  const s = t.subs.find(x=>x.id===sid); if(!s) return;
  const now = new Date().toISOString();
  if(s.done){ s.done=false; s.doneAt=null; if(t.done){ t.done=false; t.doneAt=null; } }
  else {
    s.done=true; s.doneAt=now;
    if(t.subs.every(x=>x.done) && !t.done){
      t.done=true; t.doneAt=now;
      if(S.timer.taskId===id && !S.timer.running) S.timer.taskId = null;
      toast(`Tarefa concluída às ${hhmm(now)}`, ()=>{ t.done=false; t.doneAt=null; s.done=false; s.doneAt=null; persist(); render(); });
    }
  }
